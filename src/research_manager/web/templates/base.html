<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Research Paper Manager{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
</head>
<body class="{% if username %}with-sidebar{% else %}auth-page{% endif %}">
    {% if username %}
    <aside class="topbar">
        <a class="brand" href="/">
            <span class="brand-mark">RP</span>
            <span>
                <strong>Research Paper Manager</strong>
                <small>Information management workspace</small>
            </span>
        </a>
        <nav class="main-nav" aria-label="Main navigation">
            <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H20v17H7.5A2.5 2.5 0 0 0 5 21.5v-17Z"/><path d="M5 4.5A2.5 2.5 0 0 0 2.5 2H2v17h.5A2.5 2.5 0 0 1 5 21.5"/></svg>
                <span>Library</span>
            </a>
            <a href="/statistics" class="{% if request.url.path == '/statistics' %}active{% endif %}">
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9"/><path d="M12 19V5"/><path d="M20 19v-8"/><path d="M3 19h18"/></svg>
                <span>Statistics</span>
            </a>
            <a href="/papers/import" class="{% if request.url.path == '/papers/import' %}active{% endif %}">
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
                <span>Import</span>
            </a>
            <a href="/papers/export">
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V9"/><path d="m7 14 5-5 5 5"/><path d="M5 3h14"/></svg>
                <span>Export</span>
            </a>
        </nav>
        <div class="user-menu">
            <span class="user-badge">{{ username[:1]|upper }}</span>
            <span class="user-name">Signed in as <strong>{{ username }}</strong></span>
            <form action="/logout" method="post">
                <button class="link-button" type="submit">Sign out</button>
            </form>
        </div>
    </aside>
    {% endif %}
    <main class="{% if username %}page-shell{% else %}auth-shell{% endif %}">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">Research Paper Information Management System</footer>
</body>
</html>
